<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureScan Pro | Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="panel">
        <div class="header-row">
            <h1>Dashboard</h1>
            <a class="text-link" href="{{ url_for('logout') }}">Logout</a>
        </div>
        <p class="subtitle">Welcome, {{ username }}. Scan URLs for phishing risk and common open ports.</p>

        <form method="post" class="form-card">
            <label for="url">Target URL</label>
            <input id="url" name="url" type="text" placeholder="https://example.com/login" required>

            <label for="host">Host for port scan (optional)</label>
            <input id="host" name="host" type="text" placeholder="example.com">

            <button type="submit">Run Secure Scan</button>
        </form>
    </main>
</body>
</html>
