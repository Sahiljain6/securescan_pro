<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecureScan Pro | Result</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="panel">
        <h1>Scan Result</h1>

        <section class="result-card">
            <p><strong>URL:</strong> {{ url }}</p>
            <p><strong>Classification:</strong> <span class="badge {{ result|lower }}">{{ result }}</span></p>
            <p><strong>Probability Score:</strong> {{ probability }}%</p>
            <p><strong>Open Ports:</strong>
                {% if open_ports %}
                    {{ open_ports | join(', ') }}
                {% else %}
                    None detected on common ports
                {% endif %}
            </p>
        </section>

        <a class="text-link" href="{{ url_for('dashboard') }}">← Back to Dashboard</a>
    </main>
</body>
</html>
