<!DOCTYPE html>
<html>
<head>
    <title>Scan Result</title>
</head>
<body>
    <h2>Results for {{ url }}</h2>

    <p><b>SQL Injection:</b> {{ results.sql }}</p>
    <p><b>XSS:</b> {{ results.xss }}</p>
    <p><b>Security Headers:</b> {{ results.headers }}</p>
    <p><b>Open Ports:</b> {{ ports }}</p>
    <p><b>ML Check:</b> {{ ml }}</p>

    <a href="/report/{{ url }}">Download PDF Report</a><br><br>
    <a href="/dashboard">Back to Dashboard</a>
</body>
</html>
